<html>
  <head>
    <title>lab 10</title>
    <style>
      span {
        width: 100px;
        height: 100px;
        margin: 5px 10px;
        display: inline-block;
        height: 100px;
        border: 4px solid gainsboro;
      }
      .red {
        background-color: red;
      }
      .green {
        background-color: green;
      }
      .blue {
        background-color: blue;
      }
      .photo{
        border:2px solid gray;
        padding-bottom: 20px;
        width: 300;
        height: 400;
        background-color: rgb(148, 208, 19);
        margin: auto auto 50px;
      }
      #image{
                border:5px solid grey;
                margin-top: 30px;

      }
      button{
        margin: 10px auto;
        border:1px black solid;
      }
      button:hover{
        color: red;
      }
    </style>
  </head>
  <body>

    <div align="center" class="photo">
        <div class="buttons">
            <button id="next">Next</button>
            <button id="previous">Previous</button>
          <button id="slide">Slide show</button>
            <button id="stop">stop</button>
        </div>
        <img id="image" src="images/1.jpg" width="250" height="300">
    </div>

    <div class="container">
      <span class="box red"></span>
      <span class="box green"></span>
      <span class="box blue"></span>
    </div>

    <script src="script 10.js"></script>
  </body>
</html>
